name: Generate Daily Feed

# ---------------------------------------------------------------------------
# Self-hosted variant of Benboerba620/ai-signal/.github/workflows/daily-digest.yml
#
# What changed vs upstream, and why:
#
#   1. ONE JOB -> FOUR JOBS (arxiv / podcasts / twitter / blogs), each with its
#      own short timeout and its own commit. Upstream ran everything in a single
#      job with `timeout-minutes: 75`; when the X scrape hung, "Commit feeds"
#      was skipped along with everything else, so *all* feeds silently froze
#      while the digest kept serving a stale snapshot.
#
#   2. timeout-minutes 75 -> 15/30/20/15. Historical "Generate feeds" runtime
#      is 0-2 minutes. A 75-minute ceiling only hides a hang; short ceilings
#      fail fast and let the next stage run.
#
#   3. `if: always()` on every downstream job, so one broken source can never
#      block the others from being committed.
#
#   4. `feed_scope` (manual dispatch) is honoured: a manual "Run workflow" with
#      scope=arxiv runs ONLY the arxiv job, so you can verify the pipeline
#      without the not-yet-configured twitter/podcasts secrets turning the run
#      red. `all` (default) or the nightly schedule runs everything.
#
#   5. Podcast ASR wait capped via env (upstream config allows 1800s per item
#      x 2 items, which alone can eat most of the budget).
#
# See TWITTER_TIMEOUT.patch for the code fix that removes the hang itself.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: '0 22 * * *'      # UTC 22:00 = Beijing 06:00, full run
    - cron: '30 1 * * 1-5'    # arXiv follow-up, weekdays only, Beijing 09:30
  workflow_dispatch:
    inputs:
      feed_scope:
        description: 'Which source to refresh (manual runs only)'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'arxiv'
          - 'podcasts'
          - 'twitter'
          - 'blogs'

permissions:
  contents: write

# Queue overlapping runs instead of cancelling mid-commit.
concurrency:
  group: daily-feed-${{ github.ref }}
  cancel-in-progress: false

# Scope filter shared by the three non-arxiv jobs.
#   - on schedule: only the nightly 22:00 run refreshes them; the weekday
#     01:30 arxiv-only follow-up skips them.
#   - on manual dispatch: only run when feed_scope is 'all' or this source.
# arxiv itself always runs (it is the base every other job depends on).
jobs:
  # ---------------------------------------------------------------- arxiv ---
  # Zero secrets required. Most reliable source; runs first and always commits.
  arxiv:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements-central.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
        continue-on-error: true
      - name: Generate arXiv feed
        run: python scripts/generate_feed.py --arxiv-only
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git add feeds/ || true
          git diff --cached --quiet && echo "no arxiv changes" && exit 0
          git commit -m "feed(arxiv): $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push && break || sleep 5; done

  # ------------------------------------------------------------- podcasts ---
  # Needs a VOLC_ASR_API_KEY secret for full transcripts; without it, audio
  # falls back to YouTube captions + RSS description and still commits.
  podcasts:
    needs: [arxiv]
    if: >-
      always() && (
        (github.event_name == 'workflow_dispatch' && (inputs.feed_scope == 'all' || inputs.feed_scope == 'podcasts'))
        || (github.event_name == 'schedule' && github.event.schedule == '0 22 * * *')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VOLC_ASR_API_KEY: ${{ secrets.VOLC_ASR_API_KEY }}
      # Cap the ASR poll. Upstream allows 1800s per item; 600s is plenty for
      # a 1-2 hour episode and keeps the job far away from the timeout.
      MAX_TRANSCRIPT_CHARS: '200000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements-central.txt
      - name: Generate podcast feed
        run: python scripts/generate_feed.py --podcasts-only
      - name: Transcribe missing transcripts
        if: ${{ env.VOLC_ASR_API_KEY != '' }}
        run: timeout 900 python scripts/transcribe_missing_podcasts.py || echo "ASR step timed out, continuing"
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git add feeds/ || true
          git diff --cached --quiet && echo "no podcast changes" && exit 0
          git commit -m "feed(podcasts): $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push && break || sleep 5; done

  # -------------------------------------------------------------- twitter ---
  # The fragile one: needs TWITTER_COOKIES and is the stage that hung upstream.
  # Isolated here on purpose so a hang can only ever cost this one feed.
  twitter:
    needs: [arxiv]
    if: >-
      always() && (
        (github.event_name == 'workflow_dispatch' && (inputs.feed_scope == 'all' || inputs.feed_scope == 'twitter'))
        || (github.event_name == 'schedule' && github.event.schedule == '0 22 * * *')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TWITTER_COOKIES: ${{ secrets.TWITTER_COOKIES }}
      # Hard budget for the whole X stage. See TWITTER_TIMEOUT.patch.
      TWITTER_SEARCH_TIMEOUT: '75'
      TWITTER_TOTAL_TIMEOUT: '600'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements-central.txt
      - name: Generate X feed
        run: python scripts/generate_feed.py --twitter-only || python scripts/generate_feed.py --people-only
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git add feeds/ || true
          git diff --cached --quiet && echo "no twitter changes" && exit 0
          git commit -m "feed(x): $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push && break || sleep 5; done

  # ---------------------------------------------------------------- blogs ---
  blogs:
    needs: [arxiv]
    if: >-
      always() && (
        (github.event_name == 'workflow_dispatch' && (inputs.feed_scope == 'all' || inputs.feed_scope == 'blogs'))
        || (github.event_name == 'schedule' && github.event.schedule == '0 22 * * *')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements-central.txt
      - name: Generate blogs feed
        run: python scripts/generate_feed.py --blogs-only || echo "blogs scope not supported by this version"
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git add feeds/ || true
          git diff --cached --quiet && echo "no blog changes" && exit 0
          git commit -m "feed(blogs): $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push && break || sleep 5; done
